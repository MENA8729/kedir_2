<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body{ font-family:'Inter', sans-serif; background:#f4f6f9; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .edit-card{ background:#fff; border-radius:16px; padding:32px; max-width:420px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
    .edit-card h2{ font-weight:800; margin-bottom:20px; }
    .form-label{ font-weight:600; font-size:0.9rem; }
    .form-control{ border-radius:10px; padding:10px 14px; }
    .btn-save{ background:#16a34a; border:none; border-radius:10px; padding:11px; font-weight:600; color:#fff; width:100%; }
    .btn-save:hover{ background:#15803d; color:#fff; }
    .btn-cancel{ display:block; text-align:center; margin-top:10px; color:#64748b; font-weight:600; font-size:0.9rem; }
</style>
</head>
<body>

<div class="edit-card">
    <h2><i class="bi bi-box-seam-fill me-2"></i>Edit Product</h2>
    <form method="POST" novalidate>
        {{ form.hidden_tag() }}

        <div class="mb-4">
            <label class="form-label">Product Name</label>
            {{ form.name(class="form-control") }}
            {% for error in form.name.errors %}
                <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-save">Save Changes</button>
        <a href="{{ url_for('registration') }}" class="btn-cancel">Cancel</a>
    </form>
</div>

</body>
</html>
